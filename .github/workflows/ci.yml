name: Beauty Hair Studio CI

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: node --check script.js

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build website
        run: |
          mkdir -p dist
          cp index.html style.css script.js dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: beauty-hair-studio
          path: dist/
